[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rock-seg-3d-web"
version = "0.1.0"
description = "Self-contained browser web tool for 3D rock segmentation and analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "open3d>=0.15.1",
  "numpy>=1.21.0",
  "scipy>=1.7.0",
  "laspy>=2.0.0",
  "trimesh>=3.9.0",
  "geomdl>=5.3.1",
  "pandas>=1.3.0",
  "lazrs>=0.4.0",
  "scikit-learn>=1.4.0",
  "PyYAML>=6.0.0",
  "pymeshlab>=2025.7",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["rock_seg_3d_web*"]

[tool.setuptools.package-data]
rock_seg_3d_web = ["web_static/*"]
